# Build and test automation for rb-ems-go (RB-04 EMS).
# Runs the hardware-free unit tests and cross-compiles every daemon for the
# Raspberry Pi 5 (linux/arm64). Nothing here touches SPI/I2C/GPIO.
name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: fmt · vet · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Lowest version required by the module go.mod files
          go-version: "1.24.x"
          cache-dependency-path: "**/go.sum"

      - name: Format, duplicate files, vet, unit tests, arm64 build
        run: make ci

      - name: Package
        run: make package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rb-ems-linux-arm64
          path: dist/rb-ems-*-linux-arm64.tgz
          if-no-files-found: error
